server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name www.8882088.xyz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.8882088.xyz$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.8882088.xyz;
    server_tokens off;
    root @@WEB_ROOT@@;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/www.8882088.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.8882088.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YixuTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    expires -1;
    location ^~ /api/admin/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:@@API_PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 0;
        access_log off;
        expires off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location ~* \.(webp|svg)$ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
