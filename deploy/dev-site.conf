# Development origin on the application server.
server {
    listen 127.0.0.1:18866;
    listen unix:/run/yixu-dev-origin/frp.sock;
    server_name dev-yixu.8882088.xyz;
    server_tokens off;
    absolute_redirect off;
    set_real_ip_from unix:;
    real_ip_header X-Forwarded-For;
    root /srv/yixu-wardrobe-dev/current/public;
    index index.html;
    access_log off;
    expires -1;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /admin { return 308 /admin/; }
    location ^~ /admin/ {
        if ($uri !~ "^/admin/(index\.html|app\.mjs|admin\.css)?$") { return 404; }
        alias /srv/yixu-wardrobe-dev/current/admin/;
        index index.html;
        types { text/html html; text/javascript mjs js; text/css css; }
        default_type application/octet-stream;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:18867;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 0;
        expires off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location ~* \.(webp|svg)$ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
