# Public development HTTPS and ACME on cn001.
server {
    listen 80;
    listen [::]:80;
    server_name dev-yixu.8882088.xyz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://dev-yixu.8882088.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev-yixu.8882088.xyz;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dev-yixu.8882088.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-yixu.8882088.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18866;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 0;
    }
}
