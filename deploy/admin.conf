server {
    listen 80;
    listen [::]:80;
    server_name admin.8882088.xyz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://admin.8882088.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.8882088.xyz;
    server_tokens off;
    root @@BACKEND_ROOT@@/admin;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/admin.8882088.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.8882088.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    expires -1;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:@@API_PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 0;
    }
    location ~ \.mjs$ { default_type text/javascript; try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
