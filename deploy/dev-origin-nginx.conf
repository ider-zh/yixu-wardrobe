worker_processes 1;
pid /run/yixu-dev-origin/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_body_temp_path /run/yixu-dev-origin/client-body;
    proxy_temp_path /run/yixu-dev-origin/proxy;
    fastcgi_temp_path /run/yixu-dev-origin/fastcgi;
    uwsgi_temp_path /run/yixu-dev-origin/uwsgi;
    scgi_temp_path /run/yixu-dev-origin/scgi;
    include /etc/yixu-wardrobe-dev-origin/site.conf;
}
